<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Briefy</title>
<meta name="description" content="Briefy. Launching in the coming weeks.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #16143C; --ink: #F2F0FA; --dim: #A9A5C8; --gem: #FF4FA8; }
  * { margin: 0; box-sizing: border-box; }
  body { min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 24px 16px; }
  main { text-align: center; }
  img { width: min(280px, 70vw); height: auto; }
  p { margin-top: 28px; color: var(--dim); }
  a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--gem); }
  a:hover { color: var(--gem); }
  .links { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <img src="logo.svg" alt="briefy" width="280" height="64">
  <p>Launching in the coming weeks.</p>
  <p class="links"><a href="mailto:vicky@briefy.sh">vicky@briefy.sh</a> · <a href="https://x.com/briefydev">x.com/briefydev</a></p>
</main>
</body>
</html>
